# Hace lo mismo que el proxy de vite.config.ts: el front y el back comparten origen.
# Corre sin root: el pid y los temporales van a /tmp (página de nginx en Docker Hub).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        # La foto del plato (ST-29): el back acepta hasta 4 MB por pedido y responde "La imagen pesa más de 3 MB".
        # Con el 1 MB por defecto, nginx cortaría antes con un 413 sin ese mensaje.
        client_max_body_size 5m;

        # El back atiende en /api/v1: el path pasa entero.
        # Host con el puerto: Spring compara el Origin del WebSocket contra el Host.
        location /api/ {
            proxy_pass http://back:8080;
            proxy_set_header Host $http_host;
        }

        # Sin Upgrade y Connection el WebSocket no conecta. El broker de STOMP no manda heartbeats,
        # y sin el timeout largo nginx cortaría la conexión a los 60 s sin datos.
        location /ws {
            proxy_pass http://back:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 1h;
        }

        # Las rutas del front (/mesa/{tokenQR}, /staff/{token}...) devuelven index.html al recargar.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
